# Reverse proxy + static host for the panel (SEC-01: API and web share one
# origin so SEC-08's `SameSite=Strict` session cookie round-trips without
# CORS — apps/web assumes this in both dev, via vite.config.ts's proxy, and
# here).

# Cache policy as a map rather than a per-location `add_header`.
#
# This matters more than it looks: nginx's `add_header` does NOT accumulate
# across contexts. A single `add_header` inside a `location` block discards
# EVERY header inherited from the enclosing `server` block. A
# `location = /index.html` carrying only a Cache-Control header therefore
# silently stripped the Content-Security-Policy, HSTS, nosniff,
# Referrer-Policy and Permissions-Policy headers from the one response that
# matters most — the SPA shell. And because `try_files $uri $uri/
# /index.html` internally rewrites every client-side route to /index.html,
# that was every page load in the product.
#
# Deriving the value from $uri instead keeps all headers at server level,
# declared exactly once, with no location-level `add_header` anywhere in
# this file to re-open the trap. $uri is evaluated after the internal
# rewrite, so a request for /issues correctly resolves to the /index.html
# entry below.
map $uri $xenitex_cache_control {
    # Vite emits content-hashed filenames, so asset URLs are immutable.
    default        "public, max-age=31536000, immutable";
    # The shell must never be cached, or an upgraded appliance keeps serving
    # the previous build's index.html — and therefore references to hashed
    # bundles that no longer exist — out of the browser cache.
    /index.html    "no-store";
}

# SEC-06: TLS on by default. Plain HTTP exists only to redirect. This is not
# cosmetic hardening: apps/api issues both the session and CSRF cookies with
# `Secure`, and a browser silently DISCARDS a Secure cookie delivered over
# plain HTTP on anything but localhost — so over HTTP the panel accepted
# credentials, the server created a real session, and the browser then threw
# the cookie away, leaving the user staring at the sign-in screen again with
# no error to explain it. Serving the appliance over TLS is what makes
# signing in work at all on a real VPS.
server {
    listen 8080;
    server_name _;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Generated at first run by deploy/compose/generate-self-signed-cert.sh
    # with a prominent operator warning, and replaceable with the customer's
    # own certificate by dropping their files at the same paths — see
    # docs/runbooks/install-tls-certificate.md.
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:XENITEX:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # SEC-10. Strict, nonce-free, and achievable because the panel has no
    # inline script at all: index.html loads one module bundle and nothing
    # else, so `script-src 'self'` needs no 'unsafe-inline', no
    # 'unsafe-eval', and no per-request nonce plumbing through a static
    # file server. Locking it down this way is strictly stronger than a
    # nonce allowlist, since there is no inline execution path to allow.
    #
    # `style-src` carries 'unsafe-inline' only because React sets element
    # style attributes directly for virtualised row positioning
    # (IssuesPage/AssetsPage); CSP treats an inline style attribute as
    # inline CSS. Styles cannot execute, so this does not reopen script
    # injection.
    #
    # connect-src/img-src/font-src are 'self' with no external origin
    # anywhere — the appliance is air-gapped (P1-26/DATA-07), so any
    # outbound fetch from the panel is by definition a defect, and this
    # header is what turns that from a policy statement into an enforced
    # one the browser applies.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Nothing in the panel uses any of these; denying them outright means a
    # future dependency cannot start using one unnoticed.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # SEC-06. Short max-age deliberately, with no preload: the appliance is
    # reached by private IP or an internal hostname the customer controls,
    # and pinning HTTPS for a year on a name they may reuse is a support
    # burden we would be imposing on them, not a protection.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cache-Control $xenitex_cache_control always;

    location /v1/ {
        proxy_pass http://api:8443/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A scan-plan preview over a large scope and a report generation
        # both legitimately take longer than nginx's 60s default.
        proxy_read_timeout 180s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: react-router owns every other path client-side, so a
        # direct load or refresh of e.g. /issues must still serve index.html
        # rather than nginx 404ing on a file that doesn't exist on disk.
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
