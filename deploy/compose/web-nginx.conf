# Reference reverse-proxy config for the `web` container (SEC-01: API and
# web share one origin so SEC-08's `SameSite=Strict` session cookie round-
# trips without CORS — apps/web assumes this in both dev, via vite.config.ts's
# proxy, and here). This replaces nginx-unprivileged's stock default.conf,
# which was a bare static file server with no SPA fallback and no /v1 proxy
# at all — found while investigating why the running reference deployment
# 404'd on every API call and on any client-side route hit directly.
server {
    listen 8080;
    server_name _;

    # Plain HTTP to the api container for now: apps/api doesn't terminate
    # TLS yet (SEC-06 is real Step 4/5 work — API_PORT=8443 today is just a
    # port number, not a certificate). Switch this to https:// once it does.
    location /v1/ {
        proxy_pass http://api:8443/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: react-router owns every other path client-side, so a
        # direct load or refresh of e.g. /issues must still serve index.html
        # rather than nginx 404ing on a file that doesn't exist on disk.
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
