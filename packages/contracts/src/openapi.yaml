            schema:
              type: object
              required: [planPreviewId, confirm]
              properties:
                planPreviewId: { type: string }
                confirm: { type: boolean, enum: [true] }
                standardProfileConfirmationText:
                  type: string
                  description: Required verbatim typed confirmation when the profile's intrusiveness is `standard` (SAFE-03).
      responses:
        '202':
          description: Queued. Poll the Location URL for status.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ScanRun' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Plan preview expired or was already confirmed.
          content:
            {
              application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } },
            }
