  # ------------------------------------------------------------- Exceptions
  /exceptions:
    get:
      tags: [Exceptions]
      operationId: listExceptions
      summary: Exceptions register (MOD-12)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExceptionStatus' }
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Exception' } }
                  nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
    post:
      tags: [Exceptions]
      operationId: createException
      summary: Request an exception (risk_accepted) for an issue
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueId, justification, expiresAt]
              properties:
                issueId: { type: string }
                justification: { type: string, minLength: 1 }
                expiresAt:
                  type: string
                  format: date-time
                  description: MOD-12 — must be within 365 days of the request (GATE 1-accepted maximum).
      responses:
        '201':
          {
            description: 'Created.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Exception' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: expiresAt exceeds the documented maximum.
          content:
            {
              application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } },
            }
  /exceptions/{exceptionId}:
    parameters:
      - name: exceptionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Exceptions]
      operationId: getException
      summary: Get an exception
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Exception' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /exceptions/{exceptionId}/approve:
    parameters:
      - name: exceptionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Exceptions]
      operationId: approveException
      summary: Approve — approver must differ from requester (MOD-12)
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Exception' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Approver is the same user as the requester.
          content:
            {
              application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } },
            }
  /exceptions/{exceptionId}/reject:
    parameters:
      - name: exceptionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Exceptions]
      operationId: rejectException
      summary: Reject an exception request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Exception' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /exceptions/{exceptionId}/revoke:
    parameters:
      - name: exceptionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Exceptions]
      operationId: revokeException
      summary: Revoke an approved exception early — reopens the issue
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Exception' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }

