  /authorized-scopes:
    get:
      tags: [Scopes]
      operationId: listAuthorizedScopes
      summary: List authorized scopes
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuthorizedScope' } }
                  nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
    post:
      tags: [Scopes]
      operationId: createAuthorizedScope
      summary: Declare an authorized scope (SAFE-01). Immutable once accepted.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/AuthorizedScopeCreate' } } }
      responses:
        '201':
          {
            description: 'Created.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AuthorizedScope' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
  /authorized-scopes/{scopeId}:
    parameters:
      - name: scopeId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Scopes]
      operationId: getAuthorizedScope
      summary: Get an authorized scope
      responses:
        '200':
          {
            description: 'OK.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AuthorizedScope' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /authorized-scopes/{scopeId}/supersede:
    parameters:
      - name: scopeId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Scopes]
      operationId: supersedeAuthorizedScope
      summary: >-
        SAFE-01: scopes are immutable once accepted, so "editing" one means
        declaring a brand-new scope (its own fresh attestation) that
        supersedes this one. The old record's fields never change — only its
        supersededById link is set, exactly once.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/AuthorizedScopeCreate' } } }
      responses:
        '201':
          {
            description: 'Created — the new, superseding scope.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AuthorizedScope' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This scope has already been superseded by a later declaration.
          content:
            {
              application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } },
            }

