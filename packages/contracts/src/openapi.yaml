      tags: [Scans]
      operationId: createScanRun
      summary: Confirm a plan preview and create the scan run (SAFE-08). Never blocks on execution (ADR 0006).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
