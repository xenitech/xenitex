  # NVD's own cisaExploitAdd annotation is used as the known-exploited
  # signal for now (see apps/worker/src/pipeline/process-intel-import.ts).
  /intel/status:
    get:
      tags: [Intelligence]
      operationId: getIntelStatus
      summary: UI-103 — active corpus version, record counts, and staleness
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/IntelStatus' } } },
          }
  /intel/imports:
    get:
      tags: [Intelligence]
      operationId: listIntelImports
      summary: UI-106 — sync history
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/IntelImport' } }
                  nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
  /intel/sync:
    post:
      tags: [Intelligence]
      operationId: createIntelSync
      summary: 'FEED-11 — "Update now": a bounded incremental NVD+EPSS sync, staged then applied atomically (FEED-25)'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modifiedSinceDays: { type: integer, minimum: 1, maximum: 120, default: 7 }
      responses:
        '202':
          {
            description: 'Accepted — the sync runs asynchronously in apps/worker.',
            content: { application/json: { schema: { $ref: '#/components/schemas/IntelImport' } } },
          }
        '409':
          description: Online updates are permanently disabled for this deployment (FEED-23).
          content:
            {
              application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } },
            }
  /intel/settings:
    get:
      tags: [Intelligence]
      operationId: getIntelSettings
      summary: FEED-23 — the online-update disable switch
      responses:
        '200':
          {
            description: 'OK.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/IntelSettings' } } },
          }
    patch:
      tags: [Intelligence]
      operationId: updateIntelSettings
      summary: FEED-23
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onlineUpdatesDisabled]
              properties: { onlineUpdatesDisabled: { type: boolean } }
      responses:
        '200':
          {
            description: 'OK.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/IntelSettings' } } },
          }
        '409': { $ref: '#/components/responses/StaleResource' }

  # ------------------------------------------------------------- SystemHealth
  /system-health:
    get:
      tags: [SystemHealth]
      operationId: getSystemHealth
      summary: OPS-04 — written for a non-engineer operator, plain-language component status
      responses:
        '200':
          {
            description: 'OK.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SystemHealth' } } },
          }

  # ---------------------------------------------------------------- Dashboard
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Built last, per 3.8 — every tile links to a pre-filtered view; no vanity metrics
      responses:
        '200':
          {
            description: 'OK.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } },
          }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: xenitex_session
      description: >
        Opaque server-side session (SEC-08). State-changing requests also
        require the double-submit CSRF token in the `X-CSRF-Token` header,
        matched against the session's csrfTokenHash server-side.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`. Never a raw offset (ADR 0006).
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current ETag of the resource. A stale value returns 409 (ADR 0006).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key. A retried request with the same key returns the original response rather than creating a second resource (ADR 0006).
      schema: { type: string }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string }
    AssetIdPath:
      name: assetId
      in: path
      required: true
      schema: { type: string }
    IssueIdPath:
      name: issueId
      in: path
      required: true
      schema: { type: string }
    ScanRunIdPath:
      name: scanRunId
      in: path
      required: true
      schema: { type: string }

  headers:
    ETag:
      description: Current entity tag; send back in `If-Match` on the next mutation.
      schema: { type: string }
    CorrelationId:
      description: >-
        OPS-01 — the correlation identifier for this request, propagated from
        the HTTP request through any queue job and scanner invocation it
        triggers. Echoes an inbound `X-Correlation-Id` if the client sent
        one, otherwise server-generated. Surfaced on error responses so a UI
        can quote it back in a support conversation (see ErrorState).
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    ValidationError:
      description: Schema validation failed at the API boundary (SEC-12) — unknown fields are rejected, not ignored.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Unauthorized:
      description: Not signed in, or MFA required.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Forbidden:
      description: Signed in but not authorized for this resource (SEC-13 — enforced server-side on every endpoint).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: No such resource.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Conflict:
      description: Request conflicts with current state.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    StaleResource:
      description: 'code: concurrency.stale_resource — the supplied If-Match no longer matches (ADR 0006).'
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    LockedOut:
      description: Account locked after repeated failed attempts (SEC-11).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    TooManyRequests:
      description: Rate limited (SEC-11).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    UserListPage:
      description: Page of users.
      content:
        application/json:
          schema:
            type: object
            required: [items, nextCursor]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/User' } }
              nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
    AssetListPage:
      description: Page of assets.
      content:
        application/json:
          schema:
            type: object
            required: [items, nextCursor]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/Asset' } }
              nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
    IssueListPage:
      description: Page of issues.
      content:
        application/json:
          schema:
            type: object
            required: [items, nextCursor]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/Issue' } }
              nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
    ScanRunListPage:
      description: Page of scan runs.
      content:
        application/json:
          schema:
            type: object
            required: [items, nextCursor]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/ScanRun' } }
              nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable, machine-readable, namespaced (e.g. `scope.exclusion_violation`). Clients branch on this, never on title/detail (ADR 0006).

    UserRole: { type: string, enum: [viewer, analyst, operator, administrator] }
    AssetLifecycleState: { type: string, enum: [active, inactive, decommissioned, merged] }
    AssetCriticality: { type: string, enum: [low, medium, high, critical] }
    ExposureClassification: { type: string, enum: [internal, dmz, external, isolated, unknown] }
    IdentityKeyType:
      {
        type: string,
        enum: [machine_uuid, serial_number, mac_address, fqdn, certificate_fingerprint],
      }
    IssueState:
      type: string
      enum:
        [
          new,
          triaged,
          in_progress,
          mitigated,
          verified_resolved,
          reopened,
          false_positive,
          risk_accepted,
        ]
    ConfidenceLabel: { type: string, enum: [low, medium, high] }
    RiskBand:
      {
        type: string,
        enum: [critical, high, medium, low, informational],
        description: 'docs/issues-scoring-dashboard-spec.md SCORE 2.3.',
      }
    FalsePositiveReasonCode:
      type: string
      description: >-
        MOD-11's controlled vocabulary, published here for clients to render
        a selector from. `IssueTransitionRequest.reasonCode` itself stays an
        unconstrained string (ADR 0010: tightening an existing field's
        validation is a breaking change) — this schema exists purely so the
        vocabulary has one documented, generated source instead of being
        duplicated by hand in every client.
      enum:
        [
          not_applicable_environment,
          patched_not_reflected,
          false_signature_match,
          compensating_control,
          duplicate_of_other_issue,
          other,
        ]
    ExceptionStatus: { type: string, enum: [pending, approved, rejected, expired, revoked] }
    IntrusivenessProfile: { type: string, enum: [passive-inventory, safe, standard] }
    AttestationType:
      { type: string, enum: [self_attested_owner, delegated_authority, contract_engagement, other] }
    ExclusionRuleType: { type: string, enum: [address, range, port, tag] }
    ScanRunStatus: { type: string, enum: [queued, running, paused, completed, aborted, failed] }
    ScanTargetStatus:
      type: string
      enum:
        [
          pending,
          in_progress,
          completed,
          failed,
          excluded,
          skipped_blackout,
          skipped_fragile_downgrade,
        ]
    VerificationOutcome:
      { type: string, enum: [pending, confirmed_resolved, still_present, inconclusive] }
    ReportTemplate: { type: string, enum: [executive_summary, technical_detail, delta] }
    ReportStatus: { type: string, enum: [pending, completed, failed] }
    NotificationChannelType: { type: string, enum: [email, webhook] }
    NotificationMode: { type: string, enum: [immediate, digest] }
    RetentionDataClass:
      { type: string, enum: [raw_artifacts, observations, resolved_issues, audit_log] }

    MfaChallengeRequired:
      type: object
      required: [challengeToken, mfaRequired]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        challengeToken: { type: string }

    CurrentUser:
      type: object
      required: [user, capabilities]
      properties:
        user: { $ref: '#/components/schemas/User' }
        capabilities:
          type: object
          description: P1-23 — server-computed UI capability payload. Cosmetic only; SEC-13 enforces server-side regardless.
          additionalProperties: { type: boolean }

    User:
      type: object
      required: [id, email, displayName, role, mfaEnabled, isActive, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        mfaEnabled: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        mustChangePassword:
          type: boolean
          default: false
          description: >-
            P1-07/SEC-07 — true for an administrator-provisioned account
            whose password has not yet been set by its owner. The sign-in
            flow must complete a password change before granting access to
            anything else.

    SetupStatus:
      type: object
      required:
        [
          administratorCreated,
          organizationConfigured,
          tlsConfigured,
          initialScopeDeclared,
          safetyAcknowledged,
          setupCompleted,
        ]
      properties:
        administratorCreated: { type: boolean }
        organizationConfigured: { type: boolean }
        tlsConfigured: { type: boolean }
        initialScopeDeclared: { type: boolean }
        safetyAcknowledged: { type: boolean }
        setupCompleted: { type: boolean }

    OrganizationSettings:
      type: object
      required: [organizationName, timezone, tlsMode]
      properties:
        organizationName: { type: string }
        timezone: { type: string }
        tlsMode: { type: string, enum: [self_signed, customer_certificate] }
        setupCompletedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }

    FeatureFlag:
      type: object
      required: [key, description, isEnabled]
      properties:
        key: { type: string }
        description: { type: string }
        isEnabled: { type: boolean }
        updatedAt: { type: string, format: date-time }

    OsInference:
      type: object
      required: [labelUntrusted, confidence]
      properties:
        labelUntrusted: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }

    AssetIdentityKey:
      type: object
      required: [keyType, keyValueUntrusted, confidence, firstSeen, lastSeen, isActive]
      properties:
        keyType: { $ref: '#/components/schemas/IdentityKeyType' }
        keyValueUntrusted: { type: string }
        sourceObservationId: { oneOf: [{ type: string }, { type: 'null' }] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        isActive: { type: boolean }

    AssetAddressHistoryEntry:
      type: object
      required: [address, firstSeen, lastSeen, isCurrent]
      properties:
        address: { type: string }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        isCurrent: { type: boolean }

    AssetHostnameHistoryEntry:
      type: object
      required: [hostnameUntrusted, firstSeen, lastSeen, isCurrent]
      properties:
        hostnameUntrusted: { type: string }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        isCurrent: { type: boolean }

    AssetService:
      type: object
      required: [port, protocol, firstSeen, lastSeen, isCurrent]
      properties:
        port: { type: integer }
        protocol: { type: string }
        serviceNameUntrusted: { oneOf: [{ type: string }, { type: 'null' }] }
        productUntrusted: { oneOf: [{ type: string }, { type: 'null' }] }
        versionUntrusted: { oneOf: [{ type: string }, { type: 'null' }] }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        isCurrent: { type: boolean }

    Asset:
      type: object
      required:
        - id
        - lifecycleState
        - identityKeys
        - addresses
        - hostnames
        - services
        - businessCriticality
        - exposureClassification
        - tags
        - isFragile
        - firstSeen
        - lastSeen
        - riskRating
        - riskBand
      properties:
        id: { type: string }
        lifecycleState: { $ref: '#/components/schemas/AssetLifecycleState' }
        mergedIntoAssetId: { oneOf: [{ type: string }, { type: 'null' }] }
        identityKeys: { type: array, items: { $ref: '#/components/schemas/AssetIdentityKey' } }
        addresses: { type: array, items: { $ref: '#/components/schemas/AssetAddressHistoryEntry' } }
        hostnames:
          { type: array, items: { $ref: '#/components/schemas/AssetHostnameHistoryEntry' } }
        osInference:
          oneOf:
            - $ref: '#/components/schemas/OsInference'
            - type: 'null'
        services: { type: array, items: { $ref: '#/components/schemas/AssetService' } }
        ownerTeam: { oneOf: [{ type: string }, { type: 'null' }] }
        businessCriticality: { $ref: '#/components/schemas/AssetCriticality' }
        exposureClassification: { $ref: '#/components/schemas/ExposureClassification' }
        tags: { type: array, items: { type: string } }
        isFragile: { type: boolean }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        riskRating:
          {
            oneOf: [{ type: number, minimum: 0, maximum: 100 }, { type: 'null' }],
            description: 'docs/issues-scoring-dashboard-spec.md SCORE 2.4/SCORE-08 — null until the asset has at least one open issue.',
          }
        riskBand:
          oneOf:
            - $ref: '#/components/schemas/RiskBand'
            - type: 'null'

    AssetMergeEvent:
      type: object
      required: [id, survivorAssetId, mergedAssetId, policyVersion, confidence, performedAt]
      properties:
        id: { type: string }
        survivorAssetId: { type: string }
        mergedAssetId: { type: string }
        matchedIdentityKeyType: { $ref: '#/components/schemas/IdentityKeyType' }
        policyVersion: { type: integer }
        confidence: { type: number, minimum: 0, maximum: 1 }
        performedBy: { oneOf: [{ type: string }, { type: 'null' }] }
        performedAt: { type: string, format: date-time }
        reversedBy: { oneOf: [{ type: string }, { type: 'null' }] }
        reversedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        reversalReason: { oneOf: [{ type: string }, { type: 'null' }] }

    AssetGroup:
      type: object
      required: [id, name, isDynamic]
      properties:
        id: { type: string }
        name: { type: string }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        isDynamic: { type: boolean }
        dynamicFilter: { oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }] }
        memberCount: { type: integer }
    AssetGroupCreate:
      type: object
      required: [name, isDynamic]
      properties:
        name: { type: string }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        isDynamic: { type: boolean }
        dynamicFilter: { oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }] }

    CpeAffectedRange:
      type: object
      required: [cpe]
      properties:
        cpe: { type: string }
        versionRange: { oneOf: [{ type: string }, { type: 'null' }] }

    Vulnerability:
      type: object
      required: [id, vulnIdentifier, cveIds, cweIds, affectedCpes, knownExploited, dataImportId]
      properties:
        id: { type: string }
        title:
          type: string
          description: >-
            Short, human-scannable name (e.g. "OpenSSH remote code
            execution") distinct from `description`'s full paragraph — what
            an Issues-list row title (docs/design/wireframe-issues.md) and
            any other space-constrained surface render. First-party
            catalogue content (NVD-derived), not scanner output — no
            `Untrusted` suffix.
        vulnIdentifier: { type: string }
        cveIds: { type: array, items: { type: string } }
        cweIds: { type: array, items: { type: string } }
        affectedCpes: { type: array, items: { $ref: '#/components/schemas/CpeAffectedRange' } }
        cvssVector: { oneOf: [{ type: string }, { type: 'null' }] }
        cvssVersion:
          {
            oneOf: [{ type: string }, { type: 'null' }],
            description: 'MATCH-15 — which CVSS version cvssVector/cvssBaseScore represent, always shown alongside the score.',
          }
        cvssBaseScore: { oneOf: [{ type: number, minimum: 0, maximum: 10 }, { type: 'null' }] }
        exploitProbability: { oneOf: [{ type: number, minimum: 0, maximum: 1 }, { type: 'null' }] }
        knownExploited: { type: boolean }
        knownExploitedSource: { oneOf: [{ type: string }, { type: 'null' }] }
        publishedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        modifiedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        canonicalRemediation: { oneOf: [{ type: string }, { type: 'null' }] }
        dataImportId: { type: string }

    VulnerabilityDataImport:
      type: object
      required: [id, sourceName, sourceVersion, status, importedAt]
      properties:
        id: { type: string }
        sourceName: { type: string }
        sourceVersion: { type: string }
        status: { type: string, enum: [validating, applied, failed, superseded] }
        importedAt: { type: string, format: date-time }
        supersededById: { oneOf: [{ type: string }, { type: 'null' }] }

    Observation:
      type: object
      required:
        [
          id,
          scanRunId,
          scannerAdapterKey,
          scannerAdapterVersion,
          rawArtifactId,
          targetAddress,
          extractedAttributes,
          untrustedEvidence,
          observedAt,
        ]
      properties:
        id: { type: string }
        scanRunId: { type: string }
        scannerAdapterKey: { type: string }
        scannerAdapterVersion: { type: string }
        rawArtifactId: { type: string }
        targetAddress: { type: string }
        targetPort: { oneOf: [{ type: integer }, { type: 'null' }] }
        targetProtocol: { oneOf: [{ type: string }, { type: 'null' }] }
        resolvedAssetId: { oneOf: [{ type: string }, { type: 'null' }] }
        extractedAttributes: { type: object, additionalProperties: true }
        untrustedEvidence:
          type: object
          additionalProperties: { type: string }
          description: SEC-17 — every value here originated from the scanned target. Escape on output, never render as HTML, never interpret.
        observedAt: { type: string, format: date-time }

    RawArtifact:
      type: object
      required: [id, scanRunId, scannerAdapterKey, contentType, sizeBytes, sha256, capturedAt]
      properties:
        id: { type: string }
        scanRunId: { type: string }
        scannerAdapterKey: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        capturedAt: { type: string, format: date-time }

    ScoreFactorContribution:
      description: >-
        docs/issues-scoring-dashboard-spec.md SCORE 2.2 — the scoring
        function is multiplicative, so each row states the input read, the
        multiplier it applied, and the running score after; the last row's
        runningScore always equals the issue's riskScore.
      type: object
      required: [factor, inputDescription, multiplier, runningScore]
      properties:
        factor:
          {
            type: string,
            enum:
              [
                cvssBaseScore,
                exploitProbability,
                knownExploited,
                exposureClassification,
                assetCriticality,
                confidence,
              ],
          }
        inputDescription: { type: string }
        multiplier: { type: number }
        runningScore: { type: number }

    RiskScoreSnapshot:
      type: object
      required: [id, issueId, policyVersion, totalScore, breakdown, trigger, computedAt]
      properties:
        id: { type: string }
        issueId: { type: string }
        policyVersion: { type: integer }
        totalScore: { type: number, minimum: 0, maximum: 100 }
        breakdown: { type: array, items: { $ref: '#/components/schemas/ScoreFactorContribution' } }
        trigger:
          {
            type: string,
            enum:
              [
                initial_score,
                new_observation,
                weights_changed,
                manual_recompute,
                vuln_data_updated,
              ],
          }
        computedAt: { type: string, format: date-time }

    Issue:
      type: object
      required:
        - id
        - fingerprint
        - fingerprintVersion
        - assetId
        - severity
        - riskScore
        - riskScorePolicyVersion
        - confidence
        - confidenceLabel
        - state
        - contributingObservationIds
        - firstSeen
        - lastSeen
      properties:
        id: { type: string }
        fingerprint: { type: string }
        fingerprintVersion: { type: integer }
        assetId: { type: string }
        title:
          type: string
          description: >-
            Denormalised short title (Vulnerability.title for a CVE-backed
            issue, or the configuration/exposure issue-type label for a
            MOD-04 no-CVE issue) — carried directly on Issue so the Issues
            list (P1-11) never needs a per-row join just to render a title.
        primaryCveId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: 'Denormalised from vulnerability.cveIds[0] — null for a MOD-04 configuration/exposure issue with no CVE.'
        assetLabelUntrusted:
          type: string
          description: >-
            Denormalised from the parent asset's current hostname (falling
            back to its current address) — lets the Issues list (P1-11)
            render an asset column without an N+1 asset lookup per row.
            Scanner-derived (SEC-17): plain text only, never interpreted.
        vulnerabilityId: { oneOf: [{ type: string }, { type: 'null' }] }
        port: { oneOf: [{ type: integer }, { type: 'null' }] }
        protocol: { oneOf: [{ type: string }, { type: 'null' }] }
        serviceUntrusted: { oneOf: [{ type: string }, { type: 'null' }] }
        productUntrusted: { oneOf: [{ type: string }, { type: 'null' }] }
        versionUntrusted: { oneOf: [{ type: string }, { type: 'null' }] }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        riskScore: { type: number, minimum: 0, maximum: 100 }
        riskScorePolicyVersion: { type: integer }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidenceLabel: { $ref: '#/components/schemas/ConfidenceLabel' }
        state: { $ref: '#/components/schemas/IssueState' }
        contributingObservationIds: { type: array, items: { type: string } }
        ownerUserId: { oneOf: [{ type: string }, { type: 'null' }] }
        dueDate: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        exceptionId: { oneOf: [{ type: string }, { type: 'null' }] }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        lastVerifiedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }

    IssueDetail:
      description: MOD-21 — the detail view. Every finding here is inspectable, never presented without its evidence.
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [asset, vulnerability, observations, riskScoreBreakdown, remediationGuidance]
          properties:
            asset: { $ref: '#/components/schemas/Asset' }
            vulnerability:
              oneOf:
                - $ref: '#/components/schemas/Vulnerability'
                - type: 'null'
            observations: { type: array, items: { $ref: '#/components/schemas/Observation' } }
            riskScoreBreakdown:
              { type: array, items: { $ref: '#/components/schemas/ScoreFactorContribution' } }
            remediationGuidance:
              oneOf:
                - type: object
                  required: [priorityRationale, remediationSteps]
                  properties:
                    priorityRationale: { type: string }
                    remediationSteps: { type: string }
                    references: { type: array, items: { type: string } }
                - type: 'null'

    IssueTransitionRequest:
      type: object
      required: [toState]
      properties:
        toState:
          type: string
          enum: [triaged, in_progress, mitigated, reopened, false_positive, risk_accepted]
          description: verified_resolved is intentionally excluded — MOD-13 makes it system-only, set only by a verification scan result.
        reasonCode:
          type: string
          description: Required, controlled-vocabulary, when toState is false_positive (MOD-11).
        justification:
          type: string
          description: Required (with reasonCode and an authorised actor) when toState is false_positive (MOD-11).

    IssueStateHistoryEntry:
      type: object
      required: [id, issueId, toState, transitionedAt]
      properties:
        id: { type: string }
        issueId: { type: string }
        fromState: { $ref: '#/components/schemas/IssueState' }
        toState: { $ref: '#/components/schemas/IssueState' }
        actorUserId: { oneOf: [{ type: string }, { type: 'null' }] }
        reasonCode: { oneOf: [{ type: string }, { type: 'null' }] }
        justification: { oneOf: [{ type: string }, { type: 'null' }] }
        verificationScanId: { oneOf: [{ type: string }, { type: 'null' }] }
        transitionedAt: { type: string, format: date-time }

    SavedView:
      type: object
      required: [id, name, query, isShared]
      properties:
        id: { type: string }
        name: { type: string }
        query:
          type: string
          description: The encoded filter/sort/pagination query string (P1-25) — a saved view is a named, storable version of a shareable URL.
        isShared: { type: boolean }
        createdBy: { type: string }
    SavedViewCreate:
      type: object
      required: [name, query, isShared]
      properties:
        name: { type: string }
        query: { type: string }
        isShared: { type: boolean }

    Exception:
      type: object
      required: [id, issueId, requestedBy, justification, expiresAt, status]
      properties:
        id: { type: string }
        issueId: { type: string }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        justification: { type: string }
        approverUserId: { oneOf: [{ type: string }, { type: 'null' }] }
        approvedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        expiresAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ExceptionStatus' }

    RiskScoringWeights:
      description: docs/issues-scoring-dashboard-spec.md SCORE 2.2's multiplicative weight table.
      type: object
      required:
        [
          knownExploitedMultiplier,
          exploitProbabilityBaseMultiplier,
          exploitProbabilityScale,
          exposure,
          criticality,
          confidence,
        ]
      properties:
        knownExploitedMultiplier: { type: number }
        exploitProbabilityBaseMultiplier: { type: number }
        exploitProbabilityScale: { type: number }
        exposure:
          type: object
          required: [external, dmz, internal, isolated, unknown]
          properties:
            external: { type: number }
            dmz: { type: number }
            internal: { type: number }
            isolated: { type: number }
            unknown: { type: number }
        criticality:
          type: object
          required: [critical, high, medium, low]
          properties:
            critical: { type: number }
            high: { type: number }
            medium: { type: number }
            low: { type: number }
        confidence:
          type: object
          required: [verified, corroborated, inferred]
          properties:
            verified: { type: number }
            corroborated: { type: number }
            inferred: { type: number }

    RiskScoringPolicy:
      type: object
      required: [version, weights, isActive, createdAt]
      properties:
        version: { type: integer }
        weights: { $ref: '#/components/schemas/RiskScoringWeights' }
        isActive: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    SlaPolicyRow:
      type: object
      required: [riskBand, assetCriticality, dueWithinDays]
      properties:
        riskBand: { type: string, enum: [low, medium, high, critical] }
        assetCriticality: { $ref: '#/components/schemas/AssetCriticality' }
        dueWithinDays: { type: integer, minimum: 1 }
    SlaPolicy:
      allOf:
        - $ref: '#/components/schemas/SlaPolicyRow'
        - type: object
          required: [id, version, isActive]
          properties:
            id: { type: string }
            version: { type: integer }
            isActive: { type: boolean }

    AuthorizedScopeCreate:
      type: object
      required: [name, attestationType, attestationDetails]
      properties:
        name: { type: string }
        cidrRanges: { type: array, items: { type: string } }
        hostnames: { type: array, items: { type: string } }
        attestationType: { $ref: '#/components/schemas/AttestationType' }
        attestationDetails: { type: string }
    AuthorizedScope:
      allOf:
        - $ref: '#/components/schemas/AuthorizedScopeCreate'
        - type: object
          required: [id, acceptedByUserId, acceptedAt]
          properties:
            id: { type: string }
            acceptedByUserId: { type: string }
            acceptedAt: { type: string, format: date-time }
            supersededById: { oneOf: [{ type: string }, { type: 'null' }] }

    ExclusionRuleCreate:
      type: object
      required: [ruleType, value, reason]
      properties:
        scopeId:
          { oneOf: [{ type: string }, { type: 'null' }], description: 'null = applies globally' }
        ruleType: { $ref: '#/components/schemas/ExclusionRuleType' }
        value: { type: string }
        reason: { type: string }
    ExclusionRule:
      allOf:
        - $ref: '#/components/schemas/ExclusionRuleCreate'
        - type: object
          required: [id, createdBy, isActive]
          properties:
            id: { type: string }
            createdBy: { type: string }
            isActive: { type: boolean }

    PacingConfig:
      type: object
      required: [packetsPerSecond, concurrentHosts, concurrentPortsPerHost, timeoutMs, retries]
      properties:
        packetsPerSecond: { type: integer, minimum: 1 }
        concurrentHosts: { type: integer, minimum: 1 }
        concurrentPortsPerHost: { type: integer, minimum: 1 }
        timeoutMs: { type: integer, minimum: 1 }
        retries: { type: integer, minimum: 0 }

    ScanProfileCreate:
      type: object
      required: [name, intrusiveness, pacing]
      properties:
        name: { type: string }
        intrusiveness: { $ref: '#/components/schemas/IntrusivenessProfile' }
        pacing: { $ref: '#/components/schemas/PacingConfig' }
    ScanProfile:
      allOf:
        - $ref: '#/components/schemas/ScanProfileCreate'
        - type: object
          required: [id, requiresConfirmation]
          properties:
            id: { type: string }
            requiresConfirmation:
              type: boolean
              description: 'true for `standard` (SAFE-03): typed confirmation required at scan-run creation.'

    PacingCeilings:
      type: object
      required:
        [
          maxPacketsPerSecond,
          maxConcurrentHosts,
          maxConcurrentPortsPerHost,
          maxTimeoutMs,
          maxRetries,
        ]
      properties:
        maxPacketsPerSecond: { type: integer }
        maxConcurrentHosts: { type: integer }
        maxConcurrentPortsPerHost: { type: integer }
        maxTimeoutMs: { type: integer }
        maxRetries: { type: integer }

    FragileDeviceRule:
      type: object
      required: [id, deviceClass, isEnabled]
      properties:
        id: { type: string }
        deviceClass: { type: string }
        matchCriteria: { type: object, additionalProperties: true }
        isEnabled: { type: boolean }

    BlackoutWindowCreate:
      type: object
      required: [name, timezone, startsAt, endsAt, isRecurring]
      properties:
        scopeId: { oneOf: [{ type: string }, { type: 'null' }], description: 'null = global' }
        name: { type: string }
        timezone: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isRecurring: { type: boolean }
        rrule: { oneOf: [{ type: string }, { type: 'null' }] }
    BlackoutWindow:
      allOf:
        - $ref: '#/components/schemas/BlackoutWindowCreate'
        - type: object
          required: [id]
          properties:
            id: { type: string }

    ScanScheduleCreate:
      type: object
      required: [name, scopeId, profileId, cronExpression, timezone]
      properties:
        name: { type: string }
        scopeId: { type: string }
        profileId: { type: string }
        cronExpression: { type: string }
        timezone: { type: string }
        isEnabled: { type: boolean, default: true }
    ScanSchedule:
      allOf:
        - $ref: '#/components/schemas/ScanScheduleCreate'
        - type: object
          required: [id]
          properties:
            id: { type: string }
            nextRunAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }

    ScanPlanPreviewExcludedTarget:
      type: object
      required: [target, ruleId]
      properties:
        target: { type: string }
        ruleId: { type: string }
    ScanPlanPreviewFragileDowngrade:
      type: object
      required: [target, deviceClass]
      properties:
        target: { type: string }
        deviceClass: { type: string }
    ScanPlanPreview:
      type: object
      required:
        [
          id,
          scopeId,
          profileId,
          targetCount,
          estimatedPacketVolume,
          estimatedDurationSeconds,
          excludedTargets,
          fragileDowngrades,
        ]
      properties:
        id: { type: string }
        scopeId: { type: string }
        profileId: { type: string }
        targetCount: { type: integer }
        estimatedPacketVolume: { type: integer }
        estimatedDurationSeconds: { type: integer }
        excludedTargets:
          { type: array, items: { $ref: '#/components/schemas/ScanPlanPreviewExcludedTarget' } }
        fragileDowngrades:
          { type: array, items: { $ref: '#/components/schemas/ScanPlanPreviewFragileDowngrade' } }
        confirmedByUserId: { oneOf: [{ type: string }, { type: 'null' }] }
        confirmedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }

    ScanRun:
      type: object
      required: [id, planPreviewId, scopeId, profileId, status, correlationId, queuedAt]
      properties:
        id: { type: string }
        planPreviewId: { type: string }
        scopeId: { type: string }
        profileId: { type: string }
        initiatedByUserId: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/ScanRunStatus' }
        correlationId:
          {
            type: string,
            description: OPS-01 — propagated from the HTTP request through the queue job to the scanner invocation.,
          }
        queuedAt: { type: string, format: date-time }
        startedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        completedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        abortedByUserId: { oneOf: [{ type: string }, { type: 'null' }] }
        targetsCompleted: { type: integer }
        targetsTotal: { type: integer }

    ScanRunTarget:
      type: object
      required: [id, scanRunId, targetAddress, status]
      properties:
        id: { type: string }
        scanRunId: { type: string }
        targetAddress: { type: string }
        targetPort: { oneOf: [{ type: integer }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/ScanTargetStatus' }
        excludedByRuleId: { oneOf: [{ type: string }, { type: 'null' }] }

    GlobalStopEvent:
      type: object
      required: [id, invokedVia, invokedAt, scanRunsHalted]
      properties:
        id: { type: string }
        invokedByUserId: { oneOf: [{ type: string }, { type: 'null' }] }
        invokedVia: { type: string, enum: [web, cli] }
        invokedAt: { type: string, format: date-time }
        reason: { oneOf: [{ type: string }, { type: 'null' }] }
        scanRunsHalted: { type: array, items: { type: string } }

    VerificationScan:
      type: object
      required: [id, issueId, scanRunId, requestedAt, outcome]
      properties:
        id: { type: string }
        issueId: { type: string }
        scanRunId: { type: string }
        requestedBy: { oneOf: [{ type: string }, { type: 'null' }] }
        requestedAt: { type: string, format: date-time }
        outcome: { $ref: '#/components/schemas/VerificationOutcome' }
        resolvedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }

    ScannerAdapter:
      type: object
      required: [adapterKey, version, fidelityRating, isEnabled]
      properties:
        adapterKey: { type: string }
        version: { type: string }
        fidelityRating: { type: number, minimum: 0, maximum: 1 }
        capabilities: { type: object, additionalProperties: true }
        isEnabled: { type: boolean }

    ReportCreate:
      type: object
      required: [template, scopeFilter, formats]
      properties:
        template: { $ref: '#/components/schemas/ReportTemplate' }
        scopeFilter: { type: object, additionalProperties: true }
        dateRangeStart: { type: string, format: date, description: delta template only. }
        dateRangeEnd: { type: string, format: date }
        formats: { type: array, items: { type: string, enum: [html, csv, json] }, minItems: 1 }
    Report:
      type: object
      required: [id, template, status, formats, generatedBy, generatedAt]
      properties:
        id: { type: string }
        template: { $ref: '#/components/schemas/ReportTemplate' }
        scopeFilter: { type: object, additionalProperties: true }
        dateRangeStart: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        dateRangeEnd: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/ReportStatus' }
        dataVersions:
          oneOf:
            - type: object
              properties:
                vulnerabilityDataImportId: { type: string }
                riskScoringPolicyVersion: { type: integer }
            - type: 'null'
        formats: { type: array, items: { type: string, enum: [html, csv, json] } }
        blobStoreKey: { oneOf: [{ type: string }, { type: 'null' }] }
        generatedBy: { type: string }
        generatedAt: { type: string, format: date-time }
        completedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }

    NotificationChannelCreate:
      type: object
      required: [type, config, isEnabled]
      properties:
        type: { $ref: '#/components/schemas/NotificationChannelType' }
        config:
          {
            type: object,
            additionalProperties: true,
            description: 'Non-secret config only (SEC-05) — addresses, URLs.',
          }
        secretRef:
          {
            oneOf: [{ type: string }, { type: 'null' }],
            description: 'Opaque reference into secret storage (SEC-05) — never the raw secret.',
          }
        isEnabled: { type: boolean }
    NotificationChannel:
      allOf:
        - $ref: '#/components/schemas/NotificationChannelCreate'
        - type: object
          required: [id]
          properties:
            id: { type: string }

    NotificationEvent:
      type: object
      required: [id, channelId, eventType, mode, status]
      properties:
        id: { type: string }
        channelId: { type: string }
        eventType:
          {
            type: string,
            enum:
              [scan_completed, new_high_risk_issue, sla_breach, exception_expiry, system_degraded],
          }
        mode: { $ref: '#/components/schemas/NotificationMode' }
        status: { type: string, enum: [pending, sent, failed] }
        attemptedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        deliveredAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        error: { oneOf: [{ type: string }, { type: 'null' }] }

    AuditEntry:
      type: object
      required: [id, action, targetType, targetId, outcome, occurredAt, entryHash, prevEntryHash]
      properties:
        id: { type: integer }
        actorUserId: { oneOf: [{ type: string }, { type: 'null' }] }
        sessionId: { oneOf: [{ type: string }, { type: 'null' }] }
        sourceAddress: { oneOf: [{ type: string }, { type: 'null' }] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        beforeState: { oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }] }
        afterState: { oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }] }
        outcome: { type: string, enum: [success, failure, denied] }
        occurredAt: { type: string, format: date-time }
        prevEntryHash: { type: string }
        entryHash: { type: string }

    AuditChainVerificationResult:
      type: object
      required: [verifiedUpToId, gapsDetected, hashMismatches, isIntact]
      properties:
        verifiedUpToId: { type: integer }
        gapsDetected:
          type: array
          items:
            type: object
            required: [afterId, expectedNextId]
            properties:
              afterId: { type: integer }
              expectedNextId: { type: integer }
        hashMismatches:
          type: array
          items:
            type: object
            required: [id]
            properties: { id: { type: integer } }
        isIntact: { type: boolean }

    RetentionPolicy:
      type: object
      required: [dataClass, retentionDays, minimumFloorDays]
      properties:
        dataClass: { $ref: '#/components/schemas/RetentionDataClass' }
        retentionDays: { type: integer }
        minimumFloorDays:
          {
            type: integer,
            description: 'The UI will not allow retentionDays below this (DATA-04).',
          }

    BackupRecord:
      type: object
      required: [id, startedAt, status, archiveLocation, encrypted]
      properties:
        id: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        status: { type: string, enum: [running, completed, failed] }
        archiveLocation: { type: string }
        sizeBytes: { oneOf: [{ type: integer }, { type: 'null' }] }
        encrypted: { type: boolean }
        restoreTestedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        measuredRpoSeconds: { oneOf: [{ type: integer }, { type: 'null' }] }
        measuredRtoSeconds: { oneOf: [{ type: integer }, { type: 'null' }] }

    IntelImport:
      type: object
      required: [id, sourceName, sourceVersion, status, importedAt]
      properties:
        id: { type: string }
        sourceName: { type: string }
        sourceVersion: { type: string }
        status: { type: string, enum: [validating, applied, failed, superseded] }
        fetched: { oneOf: [{ type: integer }, { type: 'null' }] }
        added: { oneOf: [{ type: integer }, { type: 'null' }] }
        modified: { oneOf: [{ type: integer }, { type: 'null' }] }
        discarded: { oneOf: [{ type: integer }, { type: 'null' }] }
        failureReason: { oneOf: [{ type: string }, { type: 'null' }] }
        importedAt: { type: string, format: date-time }
        importedBy: { oneOf: [{ type: string }, { type: 'null' }] }
        supersededById: { oneOf: [{ type: string }, { type: 'null' }] }

    IntelStatus:
      type: object
      required: [onlineUpdatesDisabled, totalVulnerabilities, knownExploitedCount]
      properties:
        onlineUpdatesDisabled: { type: boolean }
        activeCorpusImport:
          { oneOf: [{ $ref: '#/components/schemas/IntelImport' }, { type: 'null' }] }
        lastSyncAttempt: { oneOf: [{ $ref: '#/components/schemas/IntelImport' }, { type: 'null' }] }
        totalVulnerabilities: { type: integer }
        knownExploitedCount: { type: integer }

    IntelSettings:
      type: object
      required: [onlineUpdatesDisabled]
      properties:
        onlineUpdatesDisabled: { type: boolean }

    SystemHealth:
      type: object
      required:
        [components, vulnerabilityDataAgeDays, diskHeadroomBytes, queueBacklog, degradedSubsystems]
      properties:
        components:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, degraded, down] }
              detail: { type: string }
        vulnerabilityDataAgeDays: { type: number }
        templateVersions: { type: object, additionalProperties: { type: string } }
        diskHeadroomBytes: { type: integer }
        diskHeadroomProjectionDays: { oneOf: [{ type: number }, { type: 'null' }] }
        lastSuccessfulBackupAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        queueBacklog: { type: integer }
        degradedSubsystems: { type: array, items: { type: string } }

    DashboardSummary:
      type: object
      required:
        [
          riskPosture,
          topIssues,
          exposureBreakdown,
          criticalityBreakdown,
          slaCompliance,
          coverage,
          activeScans,
        ]
      properties:
        riskPosture:
          type: object
          properties:
            openIssuesByRiskBand: { type: object, additionalProperties: { type: integer } }
        topIssues:
          type: array
          description: Every tile links to a pre-filtered issues view (3.8) — no vanity metrics.
          items: { $ref: '#/components/schemas/Issue' }
        exposureBreakdown: { type: object, additionalProperties: { type: integer } }
        criticalityBreakdown: { type: object, additionalProperties: { type: integer } }
        slaCompliance:
          type: object
          required: [onTrack, approachingDue, overdue]
          properties:
            onTrack: { type: integer }
            approachingDue: { type: integer }
            overdue: { type: integer }
        coverage:
          type: object
          properties:
            assetsScannedLast30Days: { type: integer }
            assetsTotal: { type: integer }
        trend:
          type: array
          items:
            type: object
            required: [date, openIssues]
            properties:
              date: { type: string, format: date }
              openIssues: { type: integer }
        activeScans: { type: array, items: { $ref: '#/components/schemas/ScanRun' } }
        exceptionsApproachingExpiry:
          type: array
