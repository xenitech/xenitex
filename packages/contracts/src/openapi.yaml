openapi: 3.1.0
info:
  title: Xenitex Appliance API
  version: 1.0.0
  description: >
    v1 of the on-premise appliance API. This document is the single source of
    truth (P1-01) — the TypeScript client and types in this package are
    generated from it, never hand-written (P1-02).

    Conventions (see docs/adr/0006-api-conventions.md, accepted at GATE 1):
    opaque cursor pagination on every collection (`?cursor=&limit=`, response
    `{ items, nextCursor }`); RFC 9457 Problem Details on every non-2xx
    response; `Idempotency-Key` required on every creation POST;
    `ETag`/`If-Match` required on every mutation of a mutable resource; URI
    path versioning (`/v1/...`); long-running operations return `202` with a
    `Location` header pointing at a pollable resource, never a blocking
    request.

    JSON casing: camelCase, matching packages/domain. Any field whose value
    originates from a scanned target (SEC-17/AIP-02 — banners, headers,
    certificate subjects, hostnames, identity-key values, OS/service/product
    inference) carries an `Untrusted` suffix in its property name. This is
    the same greppable-naming convention as the `_untrusted` column suffix in
    docs/adr/0007-schema-conventions.md, extended to the API boundary so a
    frontend consumer can never mistake such a value for first-party data —
    it must be escaped on output, never rendered as HTML, never interpreted.
servers:
  - url: /v1
tags:
  - name: Auth
  - name: Setup
  - name: Users
  - name: OrganizationSettings
  - name: FeatureFlags
  - name: Assets
  - name: AssetGroups
  - name: Vulnerabilities
  - name: Observations
  - name: Issues
  - name: SavedViews
  - name: Exceptions
  - name: RiskScoring
  - name: SlaPolicies
  - name: Scopes
  - name: ExclusionRules
  - name: ScanProfiles
  - name: PacingCeilings
  - name: FragileDeviceRules
  - name: BlackoutWindows
  - name: ScanSchedules
  - name: Scans
  - name: VerificationScans
  - name: GlobalStop
  - name: ScannerAdapters
  - name: Reports
  - name: Notifications
  - name: Audit
  - name: Retention
  - name: Backup
  - name: SystemHealth
  - name: Dashboard
security:
  - sessionCookie: []
paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in, or MFA challenge required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CurrentUser'
                  - $ref: '#/components/schemas/MfaChallengeRequired'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/LockedOut' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/mfa/challenge:
    post:
      tags: [Auth]
      operationId: completeMfaChallenge
      summary: Complete sign-in with a TOTP code or recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/mfa/enroll:
    post:
      tags: [Auth]
      operationId: enrollMfa
      summary: Begin TOTP enrolment (SEC-09) for the signed-in user
      responses:
        '200':
          description: Provisioning secret and QR payload.
          content:
            application/json:
              schema:
                type: object
                required: [enrollmentToken, secret, qrCodeUri]
                properties:
                  enrollmentToken: { type: string }
                  secret: { type: string }
                  qrCodeUri: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/enroll/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfaEnrollment
      summary: Confirm TOTP enrolment; returns one-time recovery codes
      description: >
        Recovery codes are issued exactly once here and stored hashed
        (SEC-09) — there is no endpoint to retrieve them again later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentToken, code]
              properties:
                enrollmentToken: { type: string }
                code: { type: string }
      responses:
        '200':
          description: MFA enabled.
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate the current session
      responses:
        '204': { description: Signed out. }
  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the signed-in user's password (SEC-07); invalidates other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/session:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      summary: Current user, role, and server-computed UI capability payload
      description: P1-23 — this payload drives permission-aware rendering; it is never the sole enforcement (SEC-13).
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------- Setup
  /setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: First-run wizard progress (P1-06)
      security: []
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
  /setup/administrator:
    post:
      tags: [Setup]
      operationId: createSetupAdministrator
      summary: Create the first administrator account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, password]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        '201':
          {
            description: 'Created.',
            content: { application/json: { schema: { $ref: '#/components/schemas/User' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /setup/organization:
    post:
      tags: [Setup]
      operationId: setSetupOrganization
      summary: Set organisation name and timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationName, timezone]
              properties:
                organizationName: { type: string }
                timezone: { type: string, description: IANA timezone name (DATA-06). }
      responses:
        '204': { description: Saved. }
  /setup/tls:
    post:
      tags: [Setup]
      operationId: setSetupTls
      summary: Choose TLS mode (SEC-06) — self-signed (default) or customer certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tlsMode]
              properties:
                tlsMode: { type: string, enum: [self_signed, customer_certificate] }
      responses:
        '204': { description: Saved. }
  /setup/initial-scope:
    post:
      tags: [Setup]
      operationId: createSetupInitialScope
      summary: Declare the first authorized scope (SAFE-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizedScopeCreate' }
      responses:
        '201':
          {
            description: 'Created.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AuthorizedScope' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
  /setup/safety-acknowledgement:
    post:
      tags: [Setup]
      operationId: acknowledgeSetupSafetyDefaults
      summary: Record review and acknowledgement of scan safety defaults (B.1)
      responses:
        '204': { description: Acknowledged. }
  /setup/complete:
    post:
      tags: [Setup]
      operationId: completeSetup
      summary: Mark first-run setup complete
      responses:
        '204': { description: Setup complete. }
        '409': { $ref: '#/components/responses/Conflict' }

  # --------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (administrator only)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/UserListPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user (administrator only)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, role, password]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                role: { $ref: '#/components/schemas/UserRole' }
                password: { type: string, minLength: 12 }
      responses:
        '201':
          {
            description: 'Created.',
            content: { application/json: { schema: { $ref: '#/components/schemas/User' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/User' } } },
          }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update role or active status (administrator only)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
                displayName: { type: string }
      responses:
        '200':
          description: 'OK.'
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleResource' }
  /users/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user and revoke their sessions (administrator only)
      responses:
        '204': { description: Deactivated. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------- OrganizationSettings
  /organization-settings:
    get:
      tags: [OrganizationSettings]
      operationId: getOrganizationSettings
      summary: Get organisation settings
      responses:
        '200':
          {
            description: 'OK.',
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/OrganizationSettings' } },
              },
          }
    patch:
      tags: [OrganizationSettings]
      operationId: updateOrganizationSettings
      summary: Update organisation settings
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationSettings' }
      responses:
        '200':
          description: 'OK.'
          content:
            { application/json: { schema: { $ref: '#/components/schemas/OrganizationSettings' } } }
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StaleResource' }

  # -------------------------------------------------------- FeatureFlags
  /feature-flags:
    get:
      tags: [FeatureFlags]
      operationId: listFeatureFlags
      summary: List feature flags (EXT-07). Client-side use is cosmetic only (SEC-13).
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FeatureFlag' } }
  /feature-flags/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [FeatureFlags]
      operationId: updateFeatureFlag
      summary: Enable/disable a flag (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isEnabled]
              properties:
                isEnabled: { type: boolean }
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlag' } } },
          }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >
            Attempt to enable a flag with no implementation behind it
            (e.g. `remediation_executor_enabled` — EXT-09/PRIN-01). Hard-off
            by construction, not merely by default.
          content:
            {
              application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } },
            }

  # -------------------------------------------------------------- Assets
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List assets (virtualised list, faceted filters, P1-09/P1-22)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: lifecycleState
          in: query
          schema: { $ref: '#/components/schemas/AssetLifecycleState' }
        - name: criticality
          in: query
          schema: { $ref: '#/components/schemas/AssetCriticality' }
        - name: exposure
          in: query
          schema: { $ref: '#/components/schemas/ExposureClassification' }
        - name: tag
          in: query
          schema: { type: string }
        - name: isFragile
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Free-text search over address/hostname/tags.
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AssetListPage' }
  /assets/{assetId}:
    parameters: [{ $ref: '#/components/parameters/AssetIdPath' }]
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Asset detail — identity keys, address/hostname history, services (P1-09)
      responses:
        '200':
          description: 'OK.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Update owner, criticality, tags
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerTeam: { oneOf: [{ type: string }, { type: 'null' }] }
                businessCriticality: { $ref: '#/components/schemas/AssetCriticality' }
                tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: 'OK.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleResource' }
  /assets/{assetId}/issues:
    parameters: [{ $ref: '#/components/parameters/AssetIdPath' }]
    get:
      tags: [Assets]
      operationId: listAssetIssues
      summary: Open issues for this asset
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/IssueListPage' }
  /assets/{assetId}/scan-history:
    parameters: [{ $ref: '#/components/parameters/AssetIdPath' }]
    get:
      tags: [Assets]
      operationId: listAssetScanHistory
      summary: Scan runs that targeted this asset
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/ScanRunListPage' }
  /asset-merge-candidates:
    get:
      tags: [Assets]
      operationId: listAssetMergeCandidates
      summary: Low-confidence merge candidates awaiting operator review (MOD-06)
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AssetMergeEvent' } }
                  nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
  /asset-merges:
    post:
      tags: [Assets]
      operationId: createAssetMerge
      summary: Operator-confirmed merge of two assets (MOD-06)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [survivorAssetId, mergedAssetId]
              properties:
                survivorAssetId: { type: string }
                mergedAssetId: { type: string }
      responses:
        '201':
          {
            description: 'Created.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AssetMergeEvent' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
  /asset-merge-events/{eventId}/reverse:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Assets]
      operationId: reverseAssetMerge
      summary: Reverse an incorrect merge (MOD-06) — restores the merged asset to active, keeps its history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          {
            description: 'OK.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AssetMergeEvent' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------- AssetGroups
  /asset-groups:
    get:
      tags: [AssetGroups]
      operationId: listAssetGroups
      summary: List asset groups
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AssetGroup' } }
                  nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
    post:
      tags: [AssetGroups]
      operationId: createAssetGroup
      summary: Create an asset group
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssetGroupCreate' } } }
      responses:
        '201':
          {
            description: 'Created.',
            content: { application/json: { schema: { $ref: '#/components/schemas/AssetGroup' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
  /asset-groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [AssetGroups]
      operationId: getAssetGroup
      summary: Get an asset group
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/AssetGroup' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [AssetGroups]
      operationId: updateAssetGroup
      summary: Update an asset group
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssetGroupCreate' } } }
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/AssetGroup' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleResource' }
    delete:
      tags: [AssetGroups]
      operationId: deleteAssetGroup
      summary: Delete an asset group
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /asset-groups/{groupId}/members/{assetId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/AssetIdPath'
    put:
      tags: [AssetGroups]
      operationId: addAssetGroupMember
      summary: Add an asset to a static group
      responses:
        '204': { description: Added. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [AssetGroups]
      operationId: removeAssetGroupMember
      summary: Remove an asset from a static group
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------- Vulnerabilities
  /vulnerabilities/{vulnerabilityId}:
    parameters:
      - name: vulnerabilityId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Vulnerabilities]
      operationId: getVulnerability
      summary: Get a vulnerability catalogue entry
      responses:
        '200':
          {
            description: 'OK.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/Vulnerability' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /vulnerability-data-imports:
    get:
      tags: [Vulnerabilities]
      operationId: listVulnerabilityDataImports
      summary: Import history (P2-06/P2-07) — feeds System Health's vulnerability-data-age display
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    { type: array, items: { $ref: '#/components/schemas/VulnerabilityDataImport' } }
                  nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }

  # ---------------------------------------------------------- Observations
  /observations/{observationId}:
    parameters:
      - name: observationId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Observations]
      operationId: getObservation
      summary: Evidence detail (MOD-21) — the matched banner, response excerpt, or port state, linked to its raw artifact
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Observation' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /raw-artifacts/{rawArtifactId}/download:
    parameters:
      - name: rawArtifactId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Observations]
      operationId: downloadRawArtifact
      summary: Download the immutable raw scanner artifact an observation is backed by (DATA-01)
      responses:
        '200':
          description: Raw artifact bytes.
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Issues
  /issues:
    get:
      tags: [Issues]
      operationId: listIssues
      summary: The primary triage screen (P1-11) — virtualised, faceted, sortable by risk
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/IssueState' } }
          style: form
          explode: true
        - name: confidenceFloor
          in: query
          description: MOD-20 — list defaults to a confidence floor the user can lower deliberately.
          schema: { type: number, minimum: 0, maximum: 1, default: 0.4 }
        - name: minRiskScore
          in: query
          schema: { type: number, minimum: 0, maximum: 100 }
        - name: assetId
          in: query
          schema: { type: string }
        - name: ownerUserId
          in: query
          schema: { type: string }
        - name: overdue
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            { type: string, enum: [riskScore, dueDate, firstSeen, lastSeen], default: riskScore }
      responses:
        '200': { $ref: '#/components/responses/IssueListPage' }
  /issues/{issueId}:
    parameters: [{ $ref: '#/components/parameters/IssueIdPath' }]
    get:
      tags: [Issues]
      operationId: getIssue
      summary: Issue detail — evidence, contributing observations, risk explanation (MOD-17/MOD-21), remediation guidance
      responses:
        '200':
          description: 'OK.'
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueDetail' } } }
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Issues]
      operationId: updateIssue
      summary: Update owner or due date (non-lifecycle fields)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerUserId: { oneOf: [{ type: string }, { type: 'null' }] }
                dueDate: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      responses:
        '200':
          description: 'OK.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Issue' } } }
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleResource' }
  /issues/{issueId}/transitions:
    parameters: [{ $ref: '#/components/parameters/IssueIdPath' }]
    post:
      tags: [Issues]
      operationId: transitionIssue
      summary: 'Lifecycle transition (MOD-10/MOD-11) — verified_resolved is rejected here (MOD-13: system-only)'
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueTransitionRequest' }
      responses:
        '200':
          {
            description: 'OK.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Issue' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleResource' }
        '422':
          description: e.g. attempting `verified_resolved` manually, or `false_positive` without a reason code.
          content:
            {
              application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } },
            }
  /issues/{issueId}/history:
    parameters: [{ $ref: '#/components/parameters/IssueIdPath' }]
    get:
      tags: [Issues]
      operationId: listIssueHistory
      summary: Lifecycle state history for an issue
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    { type: array, items: { $ref: '#/components/schemas/IssueStateHistoryEntry' } }
                  nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
  /issues/{issueId}/risk-score-history:
    parameters: [{ $ref: '#/components/parameters/IssueIdPath' }]
    get:
      tags: [Issues]
      operationId: listIssueRiskScoreHistory
      summary: Every risk-score snapshot for this issue (MOD-18) — reproducible against the policy version each was computed under
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RiskScoreSnapshot' } }
  /issues/{issueId}/verification-scans:
    parameters: [{ $ref: '#/components/parameters/IssueIdPath' }]
    get:
      tags: [Issues]
      operationId: listIssueVerificationScans
      summary: Verification scans for an issue
      responses:
        '200':
          description: 'OK.'
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VerificationScan' } }
  /issues/bulk-transitions:
    post:
      tags: [Issues]
      operationId: bulkTransitionIssues
      summary: Bulk triage (P1-11)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueIds, transition]
              properties:
                issueIds: { type: array, items: { type: string }, minItems: 1, maxItems: 500 }
                transition: { $ref: '#/components/schemas/IssueTransitionRequest' }
      responses:
        '200':
          description: Per-issue outcome — a partial failure (e.g. one issue's ETag was stale) never blocks the rest.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [issueId, outcome]
                      properties:
                        issueId: { type: string }
                        outcome: { type: string, enum: [applied, failed] }
                        problem: { $ref: '#/components/schemas/ProblemDetails' }

